<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Syntax Tree with Triangle</title>
<style>
  body {
    margin: 0;
    background: #fafafa;
    font-family: monospace;
  }
  canvas {
    display: block;
    margin: 20px auto;
    background: #fff;
    border: 1px solid #ddd;
  }
</style>
</head>
<body>

<canvas id="tree" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("tree");
const ctx = canvas.getContext("2d");

ctx.font = "14px monospace";
ctx.textAlign = "center";
ctx.textBaseline = "middle";

// ───────── Drawing helpers ─────────
function drawNode(x, y, label) {
  ctx.fillText(label, x, y);
}

function drawEdge(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1 + 8);
  ctx.lineTo(x2, y2 - 8);
  ctx.stroke();
}

function drawTriangleBelow(x, y, width = 30, height = 20, label = "") {
  const topY = y + 14;
  const half = width / 2;

  ctx.beginPath();
  ctx.moveTo(x, topY);
  ctx.lineTo(x + half, topY + half);
  ctx.lineTo(x - half, topY + half);
  ctx.closePath();
  ctx.stroke();

  if (label) {
    ctx.fillText(label, x, topY + height + 12);
  }
}

// ───────── Tree data ─────────
// Sentence: "Dogs bark."
// NP is abstracted as a triangle
const tree = {
  label: "S",
  children: [
    {
      label: "NP",
      triangle: { label: "that had dried up" }   // 👈 triangle here
    },
    {
      label: "VP",
      children: [
        { label: "V", children: [{ label: "bark", children: [] }] }
      ]
    }
  ]
};

// ───────── Layout ─────────
const levelHeight = 80;
const nodeSpacing = 80;
let leafIndex = 0;

function layout(node, depth = 0) {
  node.y = 40 + depth * levelHeight;

  if (!node.children || node.children.length === 0) {
    node.x = 100 + leafIndex * nodeSpacing;
    leafIndex++;
  } else {
    node.children.forEach(child => layout(child, depth + 1));
    node.x =
      node.children.reduce((sum, c) => sum + c.x, 0) /
      node.children.length;
  }
}

// ───────── Render ─────────
function render(node) {
  drawNode(node.x, node.y, node.label);

  // Draw triangle if specified
  if (node.triangle) {
    drawTriangleBelow(
      node.x,
      node.y,
      36,
      22,
      node.triangle.label
    );
    return; // triangle replaces children
  }

  (node.children || []).forEach(child => {
    drawEdge(node.x, node.y, child.x, child.y);
    render(child);
  });
}

// ───────── Run ─────────
layout(tree);
render(tree);
</script>

</body>
</html>
