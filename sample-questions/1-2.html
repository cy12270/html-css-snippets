<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2</title>
</head>
<body>
    <p>How do you do!</p>

    <button onclick="chgColor()">Change Color</button>

    <script>
    const chgColor = () => {
        document.querySelector('p').style.color = 'red';
        document.querySelector('p').style.backgroundColor = 'green';
    }
    </script>
</body>
</html>
